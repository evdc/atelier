[workspace]
resolver = "3"
members = ["crates/*", "app"]
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
atelier-core = { path = "crates/atelier-core" }
atelier-store = { path = "crates/atelier-store" }
atelier-proto = { path = "crates/atelier-proto" }
atelier-driver = { path = "crates/atelier-driver" }

anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0", features = ["raw_value"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "sync", "process", "io-util", "time", "signal", "net", "fs"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.41", features = ["bundled"] }
uuid = { version = "1.29", features = ["v4", "v7", "serde"] }
axum = { version = "0.8", features = ["ws"] }
dirs = "7.0"
ts-rs = { version = "12.0", features = ["serde-json-impl"] }
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2
