[package]
name = "atelier-app"
description = "The Atelier desktop host: starts atelierd if needed and shows the web UI."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "atelier"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
atelier-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
